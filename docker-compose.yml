
services:
  prozorrodatamining.api:
    image: ${DOCKER_REGISTRY-}prozorrodataminingapi
    build:
      context: .
      dockerfile: ProzorroDataMining.Api/Dockerfile
    depends_on:
      - postgresdb
    environment:
      - POSTGRES_HOST=postgresdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DATABASE=ProzorroData
      - POSTGRES_PORT=5432
      # DataSync search window (ISO-8601 date or datetime). If invalid or missing, service falls back to 1 month ago -> today.
      - DATASYNC_SEARCH_MONTH_START=2026-09-01T00:00:00Z
      - DATASYNC_SEARCH_MONTH_END=2026-09-30T00:00:00Z
    ports:
      - "7654:9090"
    networks:
      - postgres-network

  frontend:
    image: node:18
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - BACKEND=http://prozorrodatamining.api:9090
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- --host 0.0.0.0"
    depends_on:
      - prozorrodatamining.api
    networks:
      - postgres-network

  postgresdb:
    image: postgres:15
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=ProzorroData
    volumes:
      - ./ProzorroDataMining.Api/DbInit:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - postgres-network

networks:
  postgres-network:
    driver: bridge

volumes:
  postgres_data: {}

